<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect to index.html while preserving the path
      var pathSegments = location.pathname.split('/').filter(Boolean);
      var basePath = '/lb-test';
      
      // Store the redirect path in sessionStorage
      if (!sessionStorage.redirect) {
        var path = location.pathname;
        if (path === basePath || path === basePath + '/') {
          path = basePath + '/';
        } else if (path.startsWith(basePath + '/')) {
          path = basePath + path.substring(basePath.length);
        }
        sessionStorage.redirect = path + location.search + location.hash;
        location.href = basePath + '/';
      }
    </script>
  </head>
  <body>
  </body>
</html>
