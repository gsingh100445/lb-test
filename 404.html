<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect to index.html while preserving the path
      var basePath = '/';
      var currentPath = location.pathname;
      
      if (!sessionStorage.redirect) {
        var redirectPath = currentPath + location.search + location.hash;
        if (basePath !== '/' && (currentPath === basePath || currentPath === basePath + '/')) {
          redirectPath = basePath + '/';
        }
        sessionStorage.redirect = redirectPath;
        location.href = basePath;
      }
    </script>
  </head>
  <body>
  </body>
</html>
